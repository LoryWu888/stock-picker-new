name: Stock Picker - Daily After Close

on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-picker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas numpy requests

      - name: Run stock picker
        run: python stock_picker.py
        timeout-minutes: 30

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-picker-${{ github.run_id }}
          path: stock_picker_*.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy HTML to _site
        run: |
          mkdir -p _site
          cp stock_picker_*.html _site/index.html
          echo "Build date: $(date)" >> _site/index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-picker
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
